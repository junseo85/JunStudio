<!DOCTYPE html>
<html th:replace="~{layouts/DefaultLayout :: layout(~{::pageContent})}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Event</title>
</head>
<body>

<main th:fragment="pageContent" class="container mt-5">  <!--this is how event page displays information  -->
    <h2 class="mb-4"> Event Schedule</h2>
    <button onclick="openFormWindow()" class="btn btn-primary mb-3"> Add</button>
    <script>
        function openFormWindow() {
            window.open("/event-form", "FormWindow", "width=500,height=500");

        }
    </script>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Event Time</th>
            <th>Location</th>
            <th>Detail</th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td th:text="${event.id}"></td>
            <td th:text="${event.title}"></td>
            <td th:text="${event.startDate}"></td>
            <td th:text="${event.endDate}"></td>
            <td th:text="${event.time}"></td>
            <td th:text="${event.location}"></td>
            <td th:text="${event.description}"></td>

           <td>
               <button class="btn btn-danger btn-sm"
                       th:onclick="'deleteEvent(' + ${event.id} + ')'"
                       title="Delete Event">
                   <i class="bi bi-trash"></i>
               </button>
           </td>

        </tr>
        </tbody>
    </table>
    <script>
        function deleteEvent(id) {
            console.log("Deleting event:", id);

            if (!confirm("Are you sure you want to delete this event?")) {
                return;
            }

            fetch('/api/event/delete/' + id, {
                method: 'DELETE'
            })
                .then(response => {
                    if (response.ok) {
                        alert("Event deleted successfully");
                        window.location.reload();
                    } else {
                        alert("Failed to delete event");
                    }
                });
        }
    </script>

</main>
</body>
</html>
