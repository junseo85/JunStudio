# Practice Coach analysis service (practice_helper). Internal only: ClusterIP,
# so only JunStudio pods can reach it - never expose it through a LoadBalancer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-helper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practice-helper
  template:
    metadata:
      labels:
        app: practice-helper
    spec:
      containers:
        - name: practice-helper
          # Build from github.com/junseo85/practice_helper (add --build-arg INSTALL_OMR=true
          # for sheet music scanning), push to ECR, and put the URI here:
          image: 808393674033.dkr.ecr.us-east-2.amazonaws.com/practice-helper:v1
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: practice-helper
spec:
  type: ClusterIP
  selector:
    app: practice-helper
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
